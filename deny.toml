[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # term_size is unmaintained; tokei depends on it unconditionally but only
  # its command-line binary calls it, never the library odx uses.
  { id = "RUSTSEC-2020-0163", reason = "only used by the tokei binary, not by its library" },
]

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  # Mozilla's root certificate data (webpki-root-certs, via the TLS
  # platform verifier); permissive, for data.
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
