[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # term_size is unmaintained; tokei depends on it unconditionally but only
  # its command-line binary calls it, never the library odx uses.
  { id = "RUSTSEC-2020-0163", reason = "only used by the tokei binary, not by its library" },
  # zbus 6 absorbed these crates; the Secret Service keyring store still
  # depends on zbus 5. Unmaintained only, no vulnerability; drop once
  # zbus-secret-service-keyring-store moves to zbus 6.
  { id = "RUSTSEC-2026-0370", reason = "zvariant via zbus 5 (keyring store); merged into zbus 6" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names via zbus 5 (keyring store); merged into zbus 6" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via zbus 5 (keyring store); merged into zbus 6" },
]

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  # Unicode data tables (finl_unicode via comrak, unicode_names2 via
  # ruff_python_parser, both from odoo-lint); permissive, for data.
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  # Mozilla's root certificate data (webpki-root-certs, via the TLS
  # platform verifier); permissive, for data.
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
