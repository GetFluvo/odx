[package]
name = "odx-forge"
description = "Forge and package index clients for odx: GitHub, GitLab, Gitea/Forgejo, PyPI; tokens, rate limiting and HTTP caching"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
keyring-core.workspace = true
odx-core.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
odx-core = { workspace = true, features = ["fakes"] }
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }
