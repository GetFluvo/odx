[package]
name = "odx-cli"
description = "odx: a Rust-native workspace manager for Odoo projects"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "odx"
path = "src/main.rs"

[dependencies]
clap.workspace = true
clap_complete.workspace = true
git-aggregate-rs.workspace = true
odx-aggregate.workspace = true
odx-analyze.workspace = true
odx-config.workspace = true
odx-dev.workspace = true
odx-core = { workspace = true, features = ["system"] }
odx-forge.workspace = true
odx-git.workspace = true
odx-platform.workspace = true
odx-sync.workspace = true
odx-dashboard.workspace = true
odx-index.workspace = true
odx-port.workspace = true
odx-verdicts.workspace = true
odx-vendor.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml_edit.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
zip.workspace = true
insta.workspace = true
odx-core = { workspace = true, features = ["fakes"] }
tempfile.workspace = true

[lints]
workspace = true
