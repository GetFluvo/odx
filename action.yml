name: odx
description: Install odx and, with `bot`, run the nightly cycle of the upstream dashboard and bot pull requests.
author: getfluvo
branding:
  icon: git-merge
  color: purple

inputs:
  version:
    description: The odx release to install (`latest`, or `0.0.7`); `none` uses the odx already on PATH.
    default: latest
  bot:
    description: Run `odx bot run` (see the automation documentation).
    default: "false"
  apply:
    description: "`true`, `false`, or `auto`: apply, except on pull_request events, where the run only plans."
    default: auto
  series:
    description: Only the dashboard of this series.
    default: ""
  max-prs:
    description: Pull requests a run opens at most (default `[tool.odx.bot] max_prs_per_run`, else 10).
    default: ""
  remote:
    description: The git remote of the project repository.
    default: origin
  working-directory:
    description: The project directory.
    default: "."
  cache:
    description: Restore and save the odx cache, keyed on odx.lock.
    default: "true"

outputs:
  plan-json:
    description: The path of the run's JSON (`odx --json bot run`), with `bot`.
    value: ${{ steps.bot.outputs.plan-json }}
  dashboard-issue:
    description: The number of the dashboard issue, with `bot`.
    value: ${{ steps.bot.outputs.dashboard-issue }}

runs:
  using: composite
  steps:
    - name: Install odx
      if: inputs.version != 'none'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      # The PATH entries come from uv and Python, not from inputs.
      run: | # zizmor: ignore[github-env]
        spec=odx-cli
        if [ "$VERSION" != latest ]; then spec="odx-cli==${VERSION#v}"; fi
        if command -v uv >/dev/null; then
          uv tool install --force "$spec"
          uv tool dir --bin >> "$GITHUB_PATH"
        else
          python3 -m pip install --user --upgrade "$spec"
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"
        fi
    - name: Restore the odx cache
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/odx
        key: odx-${{ runner.os }}-${{ hashFiles(format('{0}/odx.lock', inputs.working-directory)) }}
        restore-keys: odx-${{ runner.os }}-
    - name: odx bot run
      id: bot
      if: inputs.bot == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        APPLY: ${{ inputs.apply }}
        SERIES: ${{ inputs.series }}
        MAX_PRS: ${{ inputs.max-prs }}
        REMOTE: ${{ inputs.remote }}
        EVENT: ${{ github.event_name }}
      run: |
        args=(--json bot run --remote "$REMOTE")
        if [ "$APPLY" = true ] || { [ "$APPLY" = auto ] && [ "$EVENT" != pull_request ]; }; then
          args+=(--apply)
        fi
        if [ -n "$SERIES" ]; then args+=(--series "$SERIES"); fi
        if [ -n "$MAX_PRS" ]; then args+=(--max-prs "$MAX_PRS"); fi
        plan="$RUNNER_TEMP/odx-plan.json"
        odx "${args[@]}" > "$plan"
        echo "plan-json=$plan" >> "$GITHUB_OUTPUT"
        issue=$(python3 "$GITHUB_ACTION_PATH/scripts/dashboard_issue.py" "$plan")
        echo "dashboard-issue=$issue" >> "$GITHUB_OUTPUT"
