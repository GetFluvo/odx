<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">odx</title>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a76a8"/>
      <stop offset="0.5" stop-color="#7e5a8c"/>
      <stop offset="1" stop-color="#5e4368"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#2a2933"/>
      <stop offset="0.7" stop-color="#1c1b23"/>
      <stop offset="1" stop-color="#18181f"/>
    </radialGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b4f2dc"/>
      <stop offset="0.5" stop-color="#6fd3b0"/>
      <stop offset="1" stop-color="#3fa886"/>
    </linearGradient>
    <linearGradient id="tail" gradientUnits="userSpaceOnUse" x1="150" y1="0" x2="222" y2="0">
      <stop offset="0" stop-color="#6fd3b0"/>
      <stop offset="1" stop-color="#8fdcc0"/>
    </linearGradient>
    <linearGradient id="dee" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcbcec"/>
      <stop offset="1" stop-color="#9f72b6"/>
    </linearGradient>
    <linearGradient id="ex" gradientUnits="userSpaceOnUse" x1="330" y1="330" x2="442" y2="182">
      <stop offset="0" stop-color="#c94a1d"/>
      <stop offset="1" stop-color="#f8915a"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="248" fill="url(#ring)"/>
  <circle cx="256" cy="256" r="216" fill="url(#disc)"/>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round"
     transform="translate(256 256) scale(0.9) translate(-236 -256)">
    <!-- D: stem + bowl -->
    <path d="M222,164 H258 A92,92 0 0 1 258,348 H222 Z" stroke="url(#dee)" stroke-width="42"/>
    <!-- o: a ring whose tail merges into the D stem (branch into main) -->
    <circle cx="98" cy="256" r="52" stroke="url(#mint)" stroke-width="34"/>
    <path d="M150,256 H222" stroke="url(#tail)" stroke-width="28"/>
    <!-- X over the bowl, with a forward arrow leaving the crossing -->
    <path d="M330,182 L410,330 M330,330 L410,182" stroke="#1f1e27" stroke-width="48"/>
    <path d="M330,182 L410,330 M330,330 L410,182" stroke="url(#ex)" stroke-width="26"/>
    <path d="M370,256 H440 M420,234 L442,256 L420,278" stroke="#1f1e27" stroke-width="40"/>
    <path d="M370,256 H440 M420,234 L442,256 L420,278" stroke="url(#ex)" stroke-width="18"/>
  </g>

</svg>
