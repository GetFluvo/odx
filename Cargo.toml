[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.4"
edition = "2024"
rust-version = "1.97"
license = "MIT"
authors = ["Strategic Efficiency B.V."]
repository = "https://github.com/getfluvo/odx"
homepage = "https://odx.readthedocs.io"
readme = "README.md"
keywords = ["odoo", "oca", "git", "workspace", "cli"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
# Internal crates.
odx-core = { path = "crates/odx-core", version = "0.0.4" }
git-aggregate-rs = { path = "crates/git-aggregate-rs", version = "0.0.4" }
odx-config = { path = "crates/odx-config", version = "0.0.4" }
odx-git = { path = "crates/odx-git", version = "0.0.4" }
odx-aggregate = { path = "crates/odx-aggregate", version = "0.0.4" }
odx-forge = { path = "crates/odx-forge", version = "0.0.4" }
odx-analyze = { path = "crates/odx-analyze", version = "0.0.4" }
odx-dashboard = { path = "crates/odx-dashboard", version = "0.0.4" }
odx-index = { path = "crates/odx-index", version = "0.0.4" }
odx-port = { path = "crates/odx-port", version = "0.0.4" }
odx-lint = { path = "crates/odx-lint", version = "0.0.4" }
odx-verdicts = { path = "crates/odx-verdicts", version = "0.0.4" }
odx-platform = { path = "crates/odx-platform", version = "0.0.4" }
odx-vendor = { path = "crates/odx-vendor", version = "0.0.4" }
odx-dev = { path = "crates/odx-dev", version = "0.0.4" }
odx-sync = { path = "crates/odx-sync", version = "0.0.4" }

# External crates. Versions are pinned in Cargo.lock.
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "blocking", "json", "http2", "charset", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
ratatui = "0.30"
serde-saphyr = { version = "1", default-features = false, features = ["deserialize"] }
thiserror = "2"
tokio = { version = "1.47", features = ["rt", "rt-multi-thread", "sync", "macros", "signal", "time"] }
tokio-util = "0.7"
toml = "1"
toml_edit = "0.25"
tokei = { version = "15", default-features = false }
pep440_rs = "0.7"
sha2 = "0.10"
keyring-core = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Test-only.
assert_cmd = "2"
insta = "1"
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[workspace.lints.clippy]
# Groups (priority -1 so individual overrides below win).
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Restriction lints we opt into.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
indexing_slicing = "warn"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
unwrap_in_result = "deny"
str_to_string = "deny"
clone_on_ref_ptr = "deny"
rc_buffer = "warn"
rest_pat_in_fully_bound_structs = "deny"
same_name_method = "deny"
undocumented_unsafe_blocks = "deny"
unnecessary_self_imports = "deny"
verbose_file_reads = "deny"
allow_attributes = "deny"                # use #[expect(...)] with a reason
allow_attributes_without_reason = "deny"

# Pedantic and nursery lints that fight the codebase more than they help.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_const_for_fn = "allow"
redundant_pub_crate = "allow"     # nursery; conflicts with rustc unreachable_pub
multiple_crate_versions = "allow" # controlled by cargo-deny instead

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
