name: release

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, edited]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-drafter:
    if: github.event_name == 'push'
    name: Draft release notes
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          publish: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  autolabeler:
    if: github.event_name == 'pull_request'
    name: Label the pull request from its title
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter/autolabeler@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check-version:
    if: github.event_name == 'release'
    name: Tag matches the workspace version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare versions
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "odx-cli") | .version')"
          if [ "${TAG_NAME#v}" != "$version" ]; then
            echo "::error::Release tag $TAG_NAME does not match workspace version $version"
            exit 1
          fi

  build-wheels:
    name: Wheel ${{ matrix.package.name }} ${{ matrix.platform.target }} (${{ matrix.platform.runs-on }})
    needs: check-version
    runs-on: ${{ matrix.platform.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        package:
          - { name: odx-cli, manifest: crates/odx-cli/Cargo.toml }
          - { name: git-aggregate-rs, manifest: crates/git-aggregate-rs/Cargo.toml }
        platform:
          - { runs-on: ubuntu-latest, target: x86_64, manylinux: auto }
          - { runs-on: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { runs-on: ubuntu-latest, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { runs-on: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { runs-on: windows-latest, target: x86_64, manylinux: "off" }
          - { runs-on: macos-15-intel, target: x86_64, manylinux: "off" }
          - { runs-on: macos-latest, target: aarch64, manylinux: "off" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          rust-toolchain: stable
          args: --release --locked --out dist -m ${{ matrix.package.manifest }}
          # No build cache in release builds: avoids cache poisoning.
          sccache: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.package.name }}-${{ matrix.platform.runs-on }}-${{ matrix.platform.target }}
          path: dist/*.whl

  build-sdists:
    name: Source distributions
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: sdist odx-cli
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - name: sdist git-aggregate-rs
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist -m crates/git-aggregate-rs/Cargo.toml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sdists
          path: dist/*.tar.gz

  publish-pypi:
    name: Sign and publish to PyPI
    needs: [build-wheels, build-sdists]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/odx-cli
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the wheels and sdists
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Only the dists: a re-run must not pick up signatures of an earlier attempt.
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Generate build provenance attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"
      - name: Sign the dists with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl
          release-signing-artifacts: false
          upload-signing-artifacts: true
      - name: Remove signatures before publishing
        run: rm -f dist/*.sigstore dist/*.sigstore.json
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  publish-crates:
    name: Publish to crates.io
    # After PyPI, so both registries carry the same version.
    needs: publish-pypi
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/odx-cli
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Authenticate with crates.io (trusted publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # Published library crates first; cargo orders the packages itself.
        run: cargo publish --locked -p odx-core -p odx-config -p odx-git -p odx-forge -p odx-aggregate -p odx-analyze -p odx-platform -p odx-vendor -p odx-dev -p git-aggregate-rs -p odx-cli
