name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Cache mergiraf
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.mergiraf
          key: mergiraf-v0.20.0-${{ runner.os }}
      - name: Install mergiraf
        shell: bash
        env:
          VERSION: v0.20.0
        run: |
          case "$RUNNER_OS" in
            Linux) asset=mergiraf_x86_64-unknown-linux-gnu.tar.gz; sum=4341127da8d1da29eced669fbacc1e5d6e530115098de0b82cc9dc551a1acf37 ;;
            macOS) asset=mergiraf_aarch64-apple-darwin.tar.gz; sum=641b8a0c379d56b8b4b61070e60c3dac6e1a2fba5b59edd374a9e795b992ee5b ;;
            Windows) asset=mergiraf_x86_64-pc-windows-gnu.zip; sum=4f5e77e973febda3cacd2b52f0c0b2756854e2bff1377af69159cf0aa4051397 ;;
          esac
          dir="$HOME/.mergiraf"
          # GITHUB_PATH needs a native path (Git Bash on Windows uses /c/...).
          native="$(cygpath -w "$dir" 2>/dev/null || echo "$dir")"
          if [ -x "$dir/mergiraf" ] || [ -x "$dir/mergiraf.exe" ]; then
            echo "$native" >> "$GITHUB_PATH"
            exit 0
          fi
          mkdir -p "$dir"
          curl -sSfL --http1.1 --retry 5 --retry-all-errors --retry-delay 3 -o "$dir/$asset" "https://codeberg.org/mergiraf/mergiraf/releases/download/$VERSION/$asset"
          if command -v sha256sum >/dev/null; then check="sha256sum -c -"; else check="shasum -a 256 -c -"; fi
          echo "$sum  $dir/$asset" | $check
          case "$asset" in
            *.zip) unzip -q -o "$dir/$asset" -d "$dir" ;;
            *) tar xzf "$dir/$asset" -C "$dir" ;;
          esac
          echo "$native" >> "$GITHUB_PATH"
      - run: cargo test --workspace --all-features --locked
        env:
          INSTA_UPDATE: "no"

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install git-aggregator
        run: |
          uv tool install git-aggregator==4.1
          uv tool dir --bin >> "$GITHUB_PATH"
      - run: cargo test -p git-aggregate-rs --test aggregate --locked -- --ignored parity
      - run: cargo test -p odx-cli --test packages --locked -- --ignored real_uv

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv run --only-group docs sphinx-build -W --keep-going -b html docs docs/_build/html

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
          components: llvm-tools-preview
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Cache mergiraf
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.mergiraf
          key: mergiraf-v0.20.0-${{ runner.os }}
      - name: Install mergiraf
        shell: bash
        env:
          VERSION: v0.20.0
        run: |
          case "$RUNNER_OS" in
            Linux) asset=mergiraf_x86_64-unknown-linux-gnu.tar.gz; sum=4341127da8d1da29eced669fbacc1e5d6e530115098de0b82cc9dc551a1acf37 ;;
            macOS) asset=mergiraf_aarch64-apple-darwin.tar.gz; sum=641b8a0c379d56b8b4b61070e60c3dac6e1a2fba5b59edd374a9e795b992ee5b ;;
            Windows) asset=mergiraf_x86_64-pc-windows-gnu.zip; sum=4f5e77e973febda3cacd2b52f0c0b2756854e2bff1377af69159cf0aa4051397 ;;
          esac
          dir="$HOME/.mergiraf"
          # GITHUB_PATH needs a native path (Git Bash on Windows uses /c/...).
          native="$(cygpath -w "$dir" 2>/dev/null || echo "$dir")"
          if [ -x "$dir/mergiraf" ] || [ -x "$dir/mergiraf.exe" ]; then
            echo "$native" >> "$GITHUB_PATH"
            exit 0
          fi
          mkdir -p "$dir"
          curl -sSfL --http1.1 --retry 5 --retry-all-errors --retry-delay 3 -o "$dir/$asset" "https://codeberg.org/mergiraf/mergiraf/releases/download/$VERSION/$asset"
          if command -v sha256sum >/dev/null; then check="sha256sum -c -"; else check="shasum -a 256 -c -"; fi
          echo "$sum  $dir/$asset" | $check
          case "$asset" in
            *.zip) unzip -q -o "$dir/$asset" -d "$dir" ;;
            *) tar xzf "$dir/$asset" -C "$dir" ;;
          esac
          echo "$native" >> "$GITHUB_PATH"
      - run: >-
          cargo +nightly llvm-cov --workspace --all-features --doctests --locked
          --fail-under-lines 100 --fail-under-functions 100 --fail-under-regions 100
          --html
        env:
          INSTA_UPDATE: "no"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: target/llvm-cov/html

  bot-cycle:
    runs-on: ubuntu-latest
    env:
      FORGE_PORT: "18765"
      ODX_CACHE_DIR: ${{ github.workspace }}/../odx-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build -p odx-cli --locked
      - run: echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"
      - name: Start a fake forge and the fixture project
        run: |
          python3 scripts/fake_forge.py "$FORGE_PORT" "$RUNNER_TEMP/forge.log" &
          scripts/bot_cycle.sh "$RUNNER_TEMP/project"
      - name: The nightly cycle
        id: first
        uses: ./
        with:
          version: none
          bot: true
          apply: true
          cache: false
          working-directory: ${{ runner.temp }}/project
      - name: The same again
        uses: ./
        with:
          version: none
          bot: true
          apply: true
          cache: false
          working-directory: ${{ runner.temp }}/project
      - name: One issue created, then nothing written
        env:
          ISSUE: ${{ steps.first.outputs.dashboard-issue }}
        run: |
          test "$ISSUE" = 1
          writes=$(grep -cv '^GET ' "$RUNNER_TEMP/forge.log")
          test "$writes" = 1 || { cat "$RUNNER_TEMP/forge.log"; exit 1; }

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny
      - run: cargo deny check

  machete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-machete
      - run: cargo machete --with-metadata

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo +1.97 check --workspace --all-features --all-targets --locked

  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cocogitto
      - name: PR title and every PR commit are conventional commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@localhost"
          cog verify "$PR_TITLE"
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            cog verify "$(git log -1 --format=%B "$sha")"
          done

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo publish --dry-run --locked -p odx-core -p odx-config -p odx-git -p odx-forge -p odx-aggregate -p odx-analyze -p odx-platform -p odx-vendor -p odx-dev -p odx-sync -p odx-index -p odx-port -p odx-lint -p odx-env -p odx-verdicts -p odx-dashboard -p odx-bot -p git-aggregate-rs -p odx-cli
      - run: uvx maturin build --release --locked
      - run: uvx maturin build --release --locked -m crates/git-aggregate-rs/Cargo.toml

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1

  all-checks:
    if: always()
    needs: [fmt, clippy, test, parity, doc, docs, coverage, bot-cycle, deny, machete, msrv, typos, commits, package, zizmor]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "a required job ended with: $result"; exit 1 ;;
            esac
          done
